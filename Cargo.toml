[package]
name = "qbtc-wallet"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
rand_core = "0.6"
bip39 = "2.0"
bech32 = "0.9"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
tracing = "0.1"
hex = "0.4"
